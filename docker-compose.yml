services:
  samepage:
    build: .
    environment:
      SP_ENV: production
      SP_SECRET: ${SP_SECRET:?Set SP_SECRET to `openssl rand -hex 32` output}
      SP_DB_PATH: /data/samepage.db
      SP_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - samepage-data:/data

volumes:
  samepage-data:
