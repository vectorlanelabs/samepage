{% extends "base.html" %}
{% block title %}Home · SamePage{% endblock %}
{% block content %}
<section class="hero-card">
  <h1 class="hero-title">What's for dinner?</h1>
  <p style="font:600 13px var(--dd-font-body);color:var(--dd-text-muted);margin:8px 0 0;">Voting isn't built yet — browse the meal library or manage your groups below.</p>
</section>
<section class="stat-grid">
  <a class="stat-card" href="/library">
    <div class="stat-label">📖 Meal Library</div>
    <div class="stat-count">{{ active_meal_count }} meals</div>
  </a>
  <a class="stat-card" href="/groups">
    <div class="stat-label">👥 Groups</div>
    <div class="stat-count">{{ active_group_count }} groups</div>
  </a>
</section>
{% endblock %}
