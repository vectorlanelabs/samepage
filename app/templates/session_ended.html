{% extends "base.html" %}
{% block title %}Session ended · Same Page{% endblock %}
{% block content %}
<div class="page page--narrow">
  <section class="card hero-card hero-card--center">
    <h1 class="page-title">This session has ended.</h1>
    <p class="hero-sub">Session <span class="sp-code">{{ session.code }}</span> is finished — the group's votes are in.</p>
    <div class="hero-cta">
      <a class="btn btn-primary" href="/join">Join another session</a>
    </div>
  </section>
</div>
{% endblock %}
