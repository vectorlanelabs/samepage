{% extends "base.html" %}
{% block title %}Sign in · Same Page{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="card auth-card">
    <h1 class="page-title">Sign in</h1>
    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}
    <a class="btn {% if sso_configured %}btn-primary{% else %}btn-secondary{% endif %} btn-block" href="/auth/google{% if next %}?next={{ next|urlencode }}{% endif %}">Continue with Google</a>
    {% if not sso_configured %}
    <p class="auth-note">Google sign-in isn't configured on this server yet.</p>
    {% endif %}
  </section>
</div>
{% endblock %}
