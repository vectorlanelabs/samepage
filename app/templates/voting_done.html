{% extends "base.html" %}
{% block title %}{{ session.code }} · Same Page{% endblock %}
{% block content %}
<div class="page page--narrow">
  <h1 class="page-title">All your votes are in.</h1>
  <section class="card" style="padding:20px;margin-top:20px;">
    <p class="page-meta">Waiting for others — <span hx-get="/s/{{ session.code }}/voting-status" hx-trigger="every 2s" hx-swap="innerHTML">{{ finished }}/{{ roster }} finished.</span></p>
  </section>
</div>
{% endblock %}
