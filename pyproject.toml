[project]
name = "dinner-decider"
version = "0.1.0"
description = "Household weekly meal planning: private yes/no voting batches until the week's dinners and lunches are planned."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Required by starlette's SessionMiddleware (mandated in the M0 spec):
    # starlette >=1.x moved itsdangerous to its "full" extra, but
    # starlette.middleware.sessions imports it unconditionally.
    "itsdangerous>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
