[project]
name = "samepage"
version = "0.2.0"
description = "SamePage: a platform for groups to keep a shared database of options and vote on them privately until everyone agrees. A shared meal library is the first thing built on it."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Required by starlette's SessionMiddleware (mandated in the M0 spec):
    # starlette >=1.x moved itsdangerous to its "full" extra, but
    # starlette.middleware.sessions imports it unconditionally.
    "itsdangerous>=2.0",
    # SSO (M5a): Google OAuth/OIDC provider; httpx is authlib's async transport.
    "authlib>=1.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
