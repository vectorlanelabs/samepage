name: CI + Deploy

# Runs the test suite on every push and PR; on a green push to main, triggers a
# Coolify redeploy of the production app. Authorized by Charlie 2026-08-29
# (lifts the prior no-CI hold). Kept lean to conserve Actions minutes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies (incl. dev)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Coolify is private (only reachable on the tailnet), so the runner joins
      # the tailnet with an ephemeral auth key before hitting the deploy API.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Trigger Coolify deploy
        env:
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # On the tailnet now — call Coolify's deploy API (Bearer = a Deploy-
          # scoped token). Fire-and-forget: the build runs on Coolify
          # independently of this request, so a 2xx means "accepted", not "built".
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$URL" || echo "000")
          case "$code" in
            2*) echo "Coolify deploy triggered (HTTP $code).";;
            *)  echo "::error::Coolify deploy API returned $code — deploy NOT triggered."; exit 1;;
          esac
