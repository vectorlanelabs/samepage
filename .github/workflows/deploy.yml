name: CI + Deploy

# Runs the test suite on every push and PR; on a green push to main, triggers a
# Coolify redeploy of the production app. Authorized by Charlie 2026-08-29
# (lifts the prior no-CI hold). Kept lean to conserve Actions minutes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies (incl. dev)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Coolify is only reachable on Charlie's tailnet (private), so a public
      # GitHub runner can't hit the deploy webhook directly. Join the tailnet
      # first when a Tailscale auth key is configured; without it, the deploy
      # step reports honestly and the deploy stays a manual Coolify action.
      - name: Connect to Tailscale
        if: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Trigger Coolify deploy
        env:
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          HAVE_TS: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
        run: |
          if [ -z "$URL" ] || [ "$HAVE_TS" != "true" ]; then
            echo "::warning::Auto-deploy not wired yet — Coolify is Tailnet-only and the runner"
            echo "can't reach it without Tailscale. The tested code is on main; deploy it with a"
            echo "Redeploy in Coolify, or add TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET (+ the Tailnet"
            echo "COOLIFY_WEBHOOK_URL) to enable this step."
            exit 0
          fi
          # On the tailnet now — trigger the deploy (fire-and-forget: the build
          # runs on Coolify independently of this connection).
          AUTH=""; [ -n "$TOKEN" ] && AUTH="-H Authorization:Bearer $TOKEN"
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' $AUTH "$URL" || echo "000")
          case "$code" in
            2*) echo "Coolify deploy triggered (HTTP $code).";;
            *)  echo "::warning::Coolify webhook returned $code — check the URL/reachability. Deploy manually if needed.";;
          esac
